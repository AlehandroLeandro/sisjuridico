spring:
  application:
    name: carbocat

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS}
  refresh-token:
    expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:documents}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    region: ${S3_REGION:us-east-1}
  contract:
    expiration-cron: ${CONTRACT_EXPIRATION_CRON:0 0 0 * * *}
    expiration-zone: ${CONTRACT_EXPIRATION_ZONE:America/Bahia}
  refresh-token:
    cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 1 * * *}
  admin:
    name: ${ADMIN_NAME}
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
