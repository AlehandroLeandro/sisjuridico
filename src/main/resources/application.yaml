spring:
  application:
    name: carbocat

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sisjuridico}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

security:
  jwt:
    secret: ${JWT_SECRET:uma-chave-local-muito-grande-apenas-para-desenvolvimento}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  refresh-token:
    expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}

app:
  contract:
    expiration-cron: ${CONTRACT_EXPIRATION_CRON:0 0 0 * * *}
    expiration-zone: ${CONTRACT_EXPIRATION_ZONE:America/Bahia}
  refresh-token:
    cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 1 * * *}
  admin:
    name: ${ADMIN_NAME:Administrador}
    username: ${ADMIN_USERNAME:admin01}
    password: ${ADMIN_PASSWORD:admin123}
